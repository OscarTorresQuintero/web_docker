services:
  nginx:
    image: nginx:alpine
    container_name: proxy-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app-backend
    networks:
      - red-cba

  servidor-bd:
    image: mysql:8.0
    container_name: servidor-bd-ejemplo
    restart: always
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - red-cba

  app-backend:
    build: ./backend
    container_name: app-backend-ejemplo
    restart: always
    env_file:
      - .env
    volumes:
      - ./backend:/app
    depends_on:
      - servidor-bd
    networks:
      - red-cba

volumes:
  mysql-data:

networks:
  red-cba: