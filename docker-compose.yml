services:
  nginx-proxy-manager:
    image: 'jc21/nginx-proxy-manager:latest'
    container_name: proxy-manager
    restart: always
    ports:
      - "80:80" #Http
      - "81:81" #Administración de la API
      - "443:443" #Https
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./npm_data:/data
      - ./npm_letsencrypt:/etc/letsencrypt
    depends_on:
      app-backend:
        condition: service_started
    networks:
      - red-cba

  servidor-bd:
    image: mysql:8.4
    container_name: servidor-bd
    restart: always
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - red-cba

  app-backend:
    image: oskitar55/proyecto-app-backend:v2
    container_name: app-backend
    restart: always
    env_file:
      - .env
    ports:
      - "${FLASK_PORT}:5050"
    depends_on:
      servidor-bd:
        condition: service_healthy
    networks:
      - red-cba

volumes:
  mysql-data:

networks:
  red-cba: